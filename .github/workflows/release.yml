name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Release Tag Matches Cargo Version
        run: |
          version="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
            exit 1
          }

      - name: Install Prerequisites (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install pkg-config make cmake ninja go autoconf automake libtool

      - name: Install Prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcurl4-openssl-dev libssl-dev

      - name: Package Release
        run: TARGET_TRIPLE=${{ matrix.target }} bash scripts/package-release.sh

      - name: Verify Packaged Binary and Archive Layout
        run: |
          archive="$(ls dist/bird-v*-${{ matrix.target }}.tar.gz)"
          package="$(basename "$archive" .tar.gz)"
          BIRD_TEST_VALIDATE_ARCHIVE=1 bash scripts/install.sh "$archive" "$package"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            "dist/$package/bin/bird" --version
            "dist/$package/bin/bird" transport --json
          fi

      - name: Attest Release Archive and Checksum
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/bird-v*-${{ matrix.target }}.tar.gz
            dist/bird-v*-${{ matrix.target }}.tar.gz.sha256

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bird-release-${{ matrix.target }}
          path: |
            dist/bird-v*-${{ matrix.target }}.tar.gz
            dist/bird-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bird-release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
